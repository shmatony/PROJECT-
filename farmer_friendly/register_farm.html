<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Your Farm - Farmer Friendly</title>
  <link rel="stylesheet" href="Rizz.css">
</head>
<body>
  <h2>🚜 Register Your Farm</h2>
  <form action="register_farm.php" method="POST">
    <label for="farmer_name">Farmer Name:</label>
    <input type="text" id="farmer_name" name="farmer_name" required>

    <label for="farm_name">Farm Name:</label>
    <input type="text" id="farm_name" name="farm_name" required>

    <label for="location">Location (County):</label>
    <input type="text" id="location" name="location" required>

    <label for="product">Main Product (e.g. Tomatoes):</label>
    <input type="text" id="product" name="product" required>

    <label for="size">Farm Size (Acres):</label>
    <input type="number" id="size" name="size" step="0.1" required>

    <label for="contact">Contact Number:</label>
    <input type="text" id="contact" name="contact" required>

    <button type="submit">Register Farm</button>
  </form>
</body>
</html>
